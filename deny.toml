# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run locally with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
# Only well-known permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
