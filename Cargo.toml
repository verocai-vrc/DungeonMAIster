[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["verocai-vrc"]
repository = "https://github.com/verocai-vrc/DungeonMAIster"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
